baseURL = 'https://psp-asia-co-ltd.github.io/kaigo-hoken-news/'
languageCode = 'en'
defaultContentLanguage = 'en'
title = 'Kaigo Hoken News'
theme = 'PaperMod'
timeZone = 'Asia/Bangkok'
[pagination]
  pagerSize = 10

enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = true
buildExpired = false

[params]
  env = "production"
  description = "Japan long-term care insurance research and updates — insights into 介護保険 (kaigo hoken) for international care technology companies"
  author = "PSP Asia Co., Ltd."
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecialCharacters = true
  displayFullLangName = true
  ShowToc = true
  TocOpen = false
  
  # Home info hidden via CSS - tagline moved to footer
  # RSS link in footer instead

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[taxonomies]
  tag = "tags"
  series = "series"
  category = "categories"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[menu]
  [[menu.main]]
    identifier = "cat-basics"
    name = "Basics"
    url = "/categories/basics/"
    weight = 10
  [[menu.main]]
    identifier = "cat-providers"
    name = "Providers"
    url = "/categories/providers/"
    weight = 20
  [[menu.main]]
    identifier = "cat-technology"
    name = "Technology"
    url = "/categories/technology/"
    weight = 30
  [[menu.main]]
    identifier = "cat-budget-policy"
    name = "Budget & Policy"
    url = "/categories/budget-policy/"
    weight = 40
  [[menu.main]]
    identifier = "cat-news"
    name = "News"
    url = "/categories/news/"
    weight = 50
  [[menu.main]]
    identifier = "all-articles"
    name = "All Articles"
    url = "/posts/"
    weight = 60
  [[menu.main]]
    identifier = "nav-series"
    name = "Series"
    url = "/series/"
    weight = 70
  [[menu.main]]
    identifier = "nav-about"
    name = "About"
    url = "/about/"
    weight = 80
