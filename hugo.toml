baseURL = 'https://psp-asia-co-ltd.github.io/kaigo-hoken-news/'
languageCode = 'en'
defaultContentLanguage = 'en'
title = 'Kaigo Hoken News'
theme = 'PaperMod'
timeZone = 'Asia/Bangkok'
[pagination]
  pagerSize = 10

enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = true
buildExpired = false

[params]
  env = "production"
  description = "Japan long-term care insurance research and updates — insights into 介護保険 (kaigo hoken) for international care technology companies"
  author = "PSP Asia Co., Ltd."
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecialCharacters = true
  displayFullLangName = true
  ShowToc = true
  TocOpen = false
  
  # Home info hidden via CSS - tagline moved to footer
  # RSS link in footer instead

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "All Articles"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "Topics"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "archive"
    name = "Archive"
    url = "/archive/"
    weight = 30
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 40
