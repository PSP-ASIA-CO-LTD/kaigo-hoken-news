baseURL = 'https://psp-asia-co-ltd.github.io/kaigo-hoken-news/'
languageCode = 'en'
defaultContentLanguage = 'en'
title = 'Kaigo Hoken News'
theme = 'PaperMod'
timeZone = 'Asia/Bangkok'
[pagination]
  pagerSize = 10

enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = true
buildExpired = false

[params]
  mainSections = ["posts"]
  env = "production"
  description = "Long-term care research for care-technology companies: Japan's long-term care insurance (介護保険, kaigo hoken) and elderly care in Thailand"
  author = "PSP Asia Co., Ltd."
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecialCharacters = true
  displayFullLangName = true
  ShowToc = true
  TocOpen = false
  
  # Home info hidden via CSS - tagline moved to footer
  # RSS link in footer instead

[outputs]
  home = ["HTML", "RSS", "JSON", "LLMS", "LLMSFull", "GlossaryJSON", "Robots"]
  page = ["HTML", "Markdown"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[mediaTypes]
  [mediaTypes."text/markdown"]
    suffixes = ["md"]

[outputFormats]
  [outputFormats.Markdown]
    mediaType = "text/markdown"
    isPlainText = true
    isHTML = false
    suffix = "md"
    permalinkable = true
    rel = "alternate"
  [outputFormats.LLMS]
    mediaType = "text/plain"
    isPlainText = true
    baseName = "llms"
    suffix = "txt"
    rel = "describedby"
  [outputFormats.LLMSFull]
    mediaType = "text/plain"
    isPlainText = true
    baseName = "llms-full"
    suffix = "txt"
    notAlternative = true
  [outputFormats.GlossaryJSON]
    mediaType = "application/json"
    isPlainText = true
    baseName = "glossary"
    notAlternative = true
  [outputFormats.Robots]
    mediaType = "text/plain"
    isPlainText = true
    baseName = "robots"
    suffix = "txt"
    notAlternative = true

[taxonomies]
  tag = "tags"
  series = "series"
  category = "categories"
  country = "countries"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[menu]
  [[menu.main]]
    identifier = "nav-japan"
    name = "Japan"
    url = "/countries/japan/"
    weight = 10
  [[menu.main]]
    identifier = "nav-thailand"
    name = "Thailand"
    url = "/thailand/"
    weight = 20
  [[menu.main]]
    identifier = "nav-glossary"
    name = "Glossary"
    url = "/glossary/"
    weight = 50
  [[menu.main]]
    identifier = "nav-about"
    name = "About"
    url = "/about/"
    weight = 60
