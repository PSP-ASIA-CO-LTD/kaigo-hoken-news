baseURL = 'https://psp-asia-co-ltd.github.io/kaigo-hoken-news/'
languageCode = 'en'
defaultContentLanguage = 'en'
title = 'Kaigo Hoken News'
theme = 'PaperMod'
timeZone = 'Asia/Bangkok'
[pagination]
  pagerSize = 10

enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = true
buildExpired = false

[params]
  mainSections = ["posts"]
  env = "production"
  description = "Japan long-term care insurance research and updates — insights into 介護保険 (kaigo hoken) for international care technology companies"
  author = "PSP Asia Co., Ltd."
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecialCharacters = true
  displayFullLangName = true
  ShowToc = true
  TocOpen = false
  
  # Home info hidden via CSS - tagline moved to footer
  # RSS link in footer instead

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[taxonomies]
  tag = "tags"
  series = "series"
  category = "categories"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[menu]
  [[menu.main]]
    identifier = "nav-series"
    name = "Start Here"
    url = "/series/"
    weight = 10
  [[menu.main]]
    identifier = "nav-posts"
    name = "Posts"
    url = "/posts/"
    weight = 20
  [[menu.main]]
    identifier = "nav-guides"
    name = "Guides"
    url = "/guides/"
    weight = 30
  [[menu.main]]
    identifier = "nav-competitors"
    name = "Competitors"
    url = "/competitors/"
    weight = 40
  [[menu.main]]
    identifier = "nav-infographics"
    name = "Infographics"
    url = "/infographics/"
    weight = 45
  [[menu.main]]
    identifier = "nav-glossary"
    name = "Glossary"
    url = "/glossary/"
    weight = 50
  [[menu.main]]
    identifier = "nav-about"
    name = "About"
    url = "/about/"
    weight = 60
